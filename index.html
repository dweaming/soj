<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sword of Justice Pre‑Registrations</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111;
      --fg: #eee;
      --accent: #00cc99;
      --panel: #1f1f1f;
      --text-muted: #666;
    }
    [data-theme="light"] {
      --bg: #f4f4f4;
      --fg: #111;
      --accent: #2563eb;
      --panel: #ffffff;
      --text-muted: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      transition: background .3s, color .3s;
    }
    .container {
      background: var(--panel);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    #count {
      font-size: 3rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: .5rem;
      transition: transform .2s;
    }
    #count.bump { transform: scale(1.1); }
    #date { font-size: .9rem; color: var(--text-muted); }
    .stats {
      margin-top: 1.5rem;
      text-align: left;
      font-size: .95rem;
      color: var(--fg);
    }
    .stats div { margin: .5rem 0; }
    .milestone {
      margin-top: 1rem;
      font-size: .95rem;
      color: var(--accent);
      font-weight: 500;
    }
    .toggle {
      position: absolute;
      top: .5rem; right: .5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <button class="toggle" aria-label="Toggle theme">🌙</button>
    <h1>Sword of Justice Pre‑Registrations</h1>
    <div id="count">–</div>
    <div id="date">Loading time…</div>

    <div class="stats">
      <div>Since page open: <span id="since">–</span></div>
      <div>Rate: <span id="rate">–</span>/min</div>
    </div>

    <div class="milestone" id="milestone"></div>
  </div>

  <script>
    // Elements
    const countEl    = document.getElementById('count');
    const dateEl     = document.getElementById('date');
    const sinceEl    = document.getElementById('since');
    const rateEl     = document.getElementById('rate');
    const mileEl     = document.getElementById('milestone');
    const toggleBtn  = document.querySelector('.toggle');
    // State
    let lastTotal   = 0;
    let initial     = null;
    let startTime   = Date.now();
    let hitMillion  = false;

    // Theme toggle
    toggleBtn.addEventListener('click', ()=> {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      toggleBtn.textContent = isDark ? '☀️' : '🌙';
    });

    // Update clock every second
    async function fetchCount() {
  try {
    const res  = await fetch("https://corsproxy.io/?https://api-sea.swordofjustice.com/api/yuyue/total");
    const json = await res.json();
    if (json.code !== 0) return;

    const raw       = Number(json.data.total);
    const formatted = raw.toLocaleString("en-US");

    // very first time
    if (initial === null) {
      initial   = raw;
      startTime = Date.now();
      countEl.textContent = formatted;      // show it immediately
      sinceEl.textContent = '0';            // zero since open
      rateEl.textContent  = '0.0';          // rate=0
    }
    // on any *change* after that
    else if (raw !== lastTotal) {
      // bump animation
      countEl.classList.add("bump");
      setTimeout(()=> countEl.classList.remove("bump"), 200);

      countEl.textContent = formatted;      // update visual
      // milestone
      if (!hitMillion && raw >= 1_000_000) {
        hitMillion = true;
        mileEl.textContent = `🎉 Hit 1 000 000 at ${new Date().toLocaleString()}`;
      }
      // stats
      const delta = raw - initial;
      sinceEl.textContent = delta.toLocaleString();
      const mins = (Date.now() - startTime) / 60000;
      rateEl.textContent  = (delta / (mins||1)).toFixed(1);
    }

    lastTotal = raw; // always keep this in sync
  }
  catch (e) {
    console.error("fetchCount error:", e);
  }
}

    // Kick it off
    updateTime();
    fetchCount();
    setInterval(fetchCount, 10000);
  </script>
</body>
</html>
