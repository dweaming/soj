<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sword of Justice Pre‑Regs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111; --fg: #eee; --accent: #00cc99; --panel: #1f1f1f; --muted: #666;
    }
    [data-theme="light"] {
      --bg: #f4f4f4; --fg: #111; --accent: #2563eb; --panel: #fff; --muted: #888;
    }
    * { box-sizing: border-box; margin:0; padding:0 }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg); color:var(--fg);
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:1rem;
      transition:.3s;
    }
    .container {
      background:var(--panel); padding:2rem; border-radius:1rem;
      box-shadow:0 10px 25px rgba(0,0,0,.2); max-width:480px; width:100%;
      position:relative; text-align:center;
    }
    .toggle {
      position:absolute; top:.5rem; right:.5rem;
      background:none; border:none; color:var(--muted);
      font-size:1.2rem; cursor:pointer;
    }
    h1 { font-size:1.4rem; font-weight:600; margin-bottom:1rem }
    #count {
      font-size:3rem; font-weight:600; color:var(--accent);
      margin-bottom:.5rem; transition:.2s;
    }
    #count.bump { transform:scale(1.1) }
    #date, #countdown {
      font-size:.9rem; color:var(--muted); margin-bottom:.5rem;
    }
    .range-buttons {
      display:flex; justify-content:center; gap:.5rem; margin-bottom:.5rem;
    }
    .range-buttons button {
      background:var(--panel); border:1px solid var(--muted);
      color:var(--fg); padding:.3rem .6rem; border-radius:.3rem;
      cursor:pointer; font-size:.9rem;
    }
    .range-buttons button.active {
      background:var(--accent); border-color:var(--accent);
      color:var(--panel);
    }
    canvas { width:100%!important; height:200px!important; }
    .milestone {
      margin-top:1rem; font-size:.95rem; color:var(--accent);
      font-weight:500;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <button class="toggle" aria-label="Toggle theme">🌙</button>
    <h1>Pre‑Registrations</h1>
    <div id="count">–</div>
    <div id="date">Loading…</div>
    <div id="countdown">Countdown…</div>

    <div class="range-buttons">
      <button data-range="live" class="active">Live</button>
      <button data-range="1h">1 h</button>
      <button data-range="24h">24 h</button>
      <button data-range="7d">7 d</button>
    </div>

    <canvas id="chart"></canvas>
    <div class="milestone" id="milestone"></div>
  </div>

  <!-- Chart.js & date adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2"></script>

  <script>
    const countEl  = document.getElementById('count');
    const dateEl   = document.getElementById('date');
    const cdEl     = document.getElementById('countdown');
    const mileEl   = document.getElementById('milestone');
    const tog      = document.querySelector('.toggle');
    const rangeBtns = document.querySelectorAll('.range-buttons button');
    const ctx      = document.getElementById('chart').getContext('2d');

    const launch   = new Date('2025-09-08T00:00:00');
    let initial    = null, lastTotal = 0, startTime, hitMilestone=false;
    // Load persisted history or empty
    let history    = JSON.parse(localStorage.getItem('preRegHistory')||'[]')
                       .map(o=>({t:new Date(o.t),v:o.v}))
                       .filter(o=>Date.now()-o.t<=7*864e5);

    // Save history
    function persist() {
      localStorage.setItem('preRegHistory',
        JSON.stringify(history.map(o=>({t:o.t.getTime(),v:o.v})))
      );
    }

    // Theme toggle
    tog.onclick = ()=>{
      const theme = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', theme==='dark'?'light':'dark');
      tog.textContent = theme==='dark'?'☀️':'🌙';
    };

    // Clock & countdown
    function tick(){
      const now = new Date();
      dateEl.textContent = now.toLocaleString();
      let dms = launch - now; if(dms<0) dms=0;
      const d=Math.floor(dms/864e5),
            h=Math.floor((dms%864e5)/36e5),
            m=Math.floor((dms%36e5)/6e4),
            s=Math.floor((dms%6e4)/1e3);
      cdEl.textContent = `Launch in ${d}d ${h}h ${m}m ${s}s`;
    }
    setInterval(tick,1000); tick();

    // Chart.js setup
    const chart = new Chart(ctx, {
      type:'line',
      data:{datasets:[{
        label:'Pre‑Regs',
        data:[],
        borderColor: getComputedStyle(document.body).getPropertyValue('--accent').trim(),
        tension:0.2,
        pointRadius:0
      }]},
      options:{
        parsing:{xAxisKey:'t',yAxisKey:'v'},
        scales:{
          x:{type:'time',time:{unit:'minute',tooltipFormat:'MMM d h:mm:ss a'}},
          y:{beginAtZero:false}
        },
        plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}}
      }
    });

    // Update chart for a given range
    let currentRange='live';
    function updateChart(){
      const now=Date.now();
      let span = {live:5*60e3,'1h':60*60e3,'24h':24*60*60e3,'7d':7*24*60*60e3}[currentRange];
      const filtered = history.filter(o=> now - o.t <= span );
      chart.data.datasets[0].data = filtered;
      chart.update('none');
    }
    rangeBtns.forEach(btn=>{
      btn.onclick=()=>{
        rangeBtns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;
        updateChart();
      };
    });

    // Fetch & process
    async function fetchCount(){
      try {
        const res = await fetch(
          "https://corsproxy.io/?https://api-sea.swordofjustice.com/api/yuyue/total"
        );
        const json = await res.json();
        if(json.code!==0) return;
        const raw=Number(json.data.total);

        // first load
        if(initial===null){
          initial = raw; lastTotal=raw; startTime=Date.now();
          countEl.textContent=raw.toLocaleString();
        }
        // on change
        if(raw!==lastTotal){
          countEl.classList.add('bump');
          setTimeout(()=>countEl.classList.remove('bump'),200);
          countEl.textContent=raw.toLocaleString();

          if(!hitMilestone && raw>=1e6){
            hitMilestone=true;
            mileEl.textContent=`🎉 Hit 1 000 000 at ${new Date().toLocaleString()}`;
          }
        }
        lastTotal=raw;
        // record every fetch
        history.push({t:new Date(),v:raw});
        // keep max 7 days & persist
        history = history.filter(o=>Date.now()-o.t<=7*864e5);
        persist();
        updateChart();
      } catch(e){
        console.error('fetch error',e);
      }
    }

    // kick off
    fetchCount();
    setInterval(fetchCount,10000);
  </script>
</body>
</html>
