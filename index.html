<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sword of Justice Pre-Registrations</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f9fafb;
      color: #111827;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.05);
      max-width: 480px;
      width: 100%;
      animation: fadeIn 0.6s ease-out;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    #count {
      font-size: 3rem;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 1rem;
    }

    #milestone {
      font-size: 1rem;
      color: #16a34a;
      font-weight: 500;
      margin-top: 1rem;
    }

    #date {
      font-size: 0.95rem;
      color: #6b7280;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      #count { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sword of Justice Pre-Registrations</h1>
    <div id="count">Loading...</div>
    <div id="date"></div>
    <div id="milestone"></div>
  </div>

  <script>
    const countEl     = document.getElementById('count');
    const dateEl      = document.getElementById('date');
    const milestoneEl = document.getElementById('milestone');

    let lastTotal  = 0;
    let hitMillion = false;

    function updateTime() {
      const now = new Date();
      dateEl.textContent = "Current time: " + now.toLocaleString();
    }

    async function fetchCount() {
      try {
        const res = await fetch("https://api-sea.swordofjustice.com/api/yuyue/total");
        const json = await res.json();

        if (json.code === 0) {
          const raw = Number(json.data.total);
          if (raw !== lastTotal) {
            countEl.textContent = raw.toLocaleString("en-US");
            lastTotal = raw;

            if (!hitMillion && raw >= 1_000_000) {
              hitMillion = true;
              milestoneEl.textContent = `🎉 HIT 1 MILLION at ${new Date().toLocaleString()}`;
            }
          }
        }
      } catch {
        countEl.textContent = "Error loading count";
      }
    }

    updateTime();
    fetchCount();
    setInterval(() => {
      updateTime();
      fetchCount();
    }, 2000);
  </script>
</body>
</html>
